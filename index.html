<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>회사 매뉴얼 봇</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Pretendard", "Noto Sans KR", sans-serif;
    background: #b2c7da;
    color: #1f1f1f;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: #b2c7da;
    box-shadow: 0 0 24px rgba(0,0,0,0.08);
  }

  /* Header */
  header {
    flex: 0 0 auto;
    height: 52px;
    background: #a4b8cc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: relative;
  }
  header .left { width: 40px; }
  header .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 700;
    color: #1f1f1f;
    letter-spacing: -0.2px;
  }
  header .right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #settingsBtn {
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 6px 8px;
    line-height: 1;
    border-radius: 8px;
  }
  #settingsBtn:hover { background: rgba(0,0,0,0.06); }

  /* Chat area */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 12px 16px;
    background: #b2c7da;
    scroll-behavior: smooth;
  }
  .day-divider {
    text-align: center;
    margin: 8px 0 14px;
  }
  .day-divider span {
    background: rgba(0,0,0,0.18);
    color: #fff;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
  }
  .msg-row {
    display: flex;
    margin-bottom: 8px;
    align-items: flex-end;
    gap: 6px;
  }
  .msg-row.bot { justify-content: flex-start; }
  .msg-row.me { justify-content: flex-end; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06);
  }
  .bubble-col {
    display: flex;
    flex-direction: column;
    max-width: 75%;
  }
  .bubble-col.me { align-items: flex-end; }
  .bubble-col.bot { align-items: flex-start; }
  .sender {
    font-size: 12px;
    color: #1f1f1f;
    margin: 0 4px 3px;
  }
  .bubble-wrap {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }
  .bubble {
    padding: 9px 12px;
    font-size: 14.5px;
    line-height: 1.45;
    border-radius: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  }
  .me .bubble {
    background: #fee500;
    color: #1f1f1f;
    border-top-right-radius: 4px;
  }
  .bot .bubble {
    background: #ffffff;
    color: #1f1f1f;
    border-top-left-radius: 4px;
  }
  .time {
    font-size: 10.5px;
    color: rgba(0,0,0,0.5);
    margin: 0 2px;
    flex-shrink: 0;
  }
  .typing .bubble {
    color: #888;
    font-style: italic;
  }
  .dots {
    display: inline-block;
  }
  .dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }

  /* Input bar */
  #inputbar {
    flex: 0 0 auto;
    background: #f6f6f6;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding: 8px 10px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #message {
    flex: 1;
    min-height: 38px;
    max-height: 120px;
    padding: 9px 12px;
    border: 1px solid #e2e2e2;
    border-radius: 18px;
    background: #fff;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    resize: none;
    line-height: 1.4;
  }
  #message:focus { border-color: #b2c7da; }
  #sendBtn {
    flex: 0 0 auto;
    background: #fee500;
    color: #1f1f1f;
    border: none;
    border-radius: 18px;
    padding: 0 16px;
    height: 38px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #sendBtn:hover { background: #ffd900; }
  #sendBtn:disabled {
    background: #e0e0e0;
    color: #999;
    cursor: not-allowed;
  }

  /* Modal */
  #modalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  #modalBackdrop.active { display: flex; }
  #modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  #modal header {
    height: 48px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  #modal header .modal-title {
    font-size: 16px;
    font-weight: 700;
  }
  #closeBtn {
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #666;
    padding: 4px 8px;
  }
  .modal-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  .field .help {
    font-size: 11.5px;
    color: #888;
    margin-top: 4px;
    line-height: 1.4;
  }
  .field input[type="password"],
  .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fafafa;
    outline: none;
  }
  .field input[type="password"]:focus,
  .field textarea:focus {
    border-color: #fee500;
    background: #fff;
  }
  .field textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.5;
  }
  .counter {
    font-size: 11px;
    color: #999;
    text-align: right;
    margin-top: 2px;
  }
  .modal-footer {
    padding: 12px 16px;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: #fee500; color: #1f1f1f; }
  .btn-primary:hover { background: #ffd900; }
  .btn-secondary { background: #f0f0f0; color: #555; }
  .btn-secondary:hover { background: #e5e5e5; }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Scrollbar */
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
  .modal-body::-webkit-scrollbar { width: 6px; }
  .modal-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="left"></div>
    <div class="title">회사 매뉴얼 봇</div>
    <div class="right">
      <button id="settingsBtn" title="설정" aria-label="설정">⚙️</button>
    </div>
  </header>

  <div id="chat">
    <div class="day-divider"><span id="todayLabel"></span></div>
  </div>

  <form id="inputbar" autocomplete="off">
    <textarea id="message" rows="1" placeholder="메시지 입력"></textarea>
    <button type="submit" id="sendBtn">전송</button>
  </form>
</div>

<div id="modalBackdrop">
  <div id="modal">
    <header>
      <div class="modal-title">⚙️ 설정</div>
      <button id="closeBtn" type="button" aria-label="닫기">✕</button>
    </header>
    <div class="modal-body">
      <div class="field">
        <label for="apiKey">Gemini API 키</label>
        <input type="password" id="apiKey" placeholder="AI..." autocomplete="off" />
        <div class="help">aistudio.google.com 에서 발급. 브라우저에만 저장되며 외부 서버로 전송되지 않습니다.</div>
      </div>
      <div class="field">
        <label for="manual">매뉴얼 (약 1,000자)</label>
        <textarea id="manual" placeholder="여기에 회사 매뉴얼이나 본인 정보를 자유롭게 작성하세요. 1인칭으로 써도 됩니다."></textarea>
        <div class="counter"><span id="manualLen">0</span>자</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelBtn" type="button">취소</button>
      <button class="btn btn-primary" id="saveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  const STORAGE_KEY = 'kakao_manual_bot_v1';
  const MODEL = 'gemini-2.5-flash';
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

  const $ = (id) => document.getElementById(id);
  const chatEl = $('chat');
  const messageEl = $('message');
  const sendBtn = $('sendBtn');
  const inputForm = $('inputbar');
  const settingsBtn = $('settingsBtn');
  const modalBackdrop = $('modalBackdrop');
  const closeBtn = $('closeBtn');
  const cancelBtn = $('cancelBtn');
  const saveBtn = $('saveBtn');
  const apiKeyEl = $('apiKey');
  const manualEl = $('manual');
  const manualLenEl = $('manualLen');
  const toastEl = $('toast');

  let state = loadState();
  let isAnswering = false;
  let typingRow = null;

  // Initialize date label
  const today = new Date();
  $('todayLabel').textContent = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;

  // Greeting on first load
  if (!state.apiKey || !state.manual) {
    addBotMessage('안녕하세요! 회사 매뉴얼 봇이에요.\n오른쪽 위 ⚙️ 버튼을 눌러서 API 키와 매뉴얼을 먼저 등록해 주세요.');
  } else {
    addBotMessage('안녕하세요! 무엇을 도와드릴까요?');
  }

  // ===== Storage =====
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { apiKey: '', manual: '' };
      return JSON.parse(raw);
    } catch (e) {
      return { apiKey: '', manual: '' };
    }
  }
  function saveState(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  // ===== Modal =====
  function openModal() {
    apiKeyEl.value = state.apiKey || '';
    manualEl.value = state.manual || '';
    manualLenEl.textContent = (state.manual || '').length;
    modalBackdrop.classList.add('active');
    setTimeout(() => apiKeyEl.focus(), 50);
  }
  function closeModal() {
    modalBackdrop.classList.remove('active');
  }
  settingsBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  cancelBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });
  manualEl.addEventListener('input', () => {
    manualLenEl.textContent = manualEl.value.length;
  });
  saveBtn.addEventListener('click', () => {
    const apiKey = apiKeyEl.value.trim();
    const manual = manualEl.value.trim();
    if (!apiKey) { showToast('API 키를 입력해 주세요'); return; }
    if (!manual) { showToast('매뉴얼을 입력해 주세요'); return; }
    state = { apiKey, manual };
    saveState(state);
    closeModal();
    showToast('저장되었습니다');
  });

  // ===== Chat helpers =====
  function nowHM() {
    const d = new Date();
    const ampm = d.getHours() < 12 ? '오전' : '오후';
    let h = d.getHours() % 12;
    if (h === 0) h = 12;
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${ampm} ${h}:${m}`;
  }

  function addBotMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble-col bot">
        <div class="sender">회사 매뉴얼 봇</div>
        <div class="bubble-wrap">
          <div class="bubble"></div>
          <div class="time">${nowHM()}</div>
        </div>
      </div>`;
    row.querySelector('.bubble').textContent = text;
    chatEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row me';
    row.innerHTML = `
      <div class="bubble-col me">
        <div class="bubble-wrap">
          <div class="time">${nowHM()}</div>
          <div class="bubble"></div>
        </div>
      </div>`;
    row.querySelector('.bubble').textContent = text;
    chatEl.appendChild(row);
    scrollBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row bot typing';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble-col bot">
        <div class="bubble-wrap">
          <div class="bubble">입력 중<span class="dots"></span></div>
        </div>
      </div>`;
    chatEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function scrollBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ===== Input behavior =====
  messageEl.addEventListener('input', () => {
    messageEl.style.height = 'auto';
    messageEl.style.height = Math.min(messageEl.scrollHeight, 120) + 'px';
  });

  messageEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      inputForm.requestSubmit();
    }
  });

  inputForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isAnswering) return;
    const text = messageEl.value.trim();
    if (!text) return;

    if (!state.apiKey || !state.manual) {
      addUserMessage(text);
      messageEl.value = '';
      messageEl.style.height = 'auto';
      addBotMessage('먼저 ⚙️ 설정에서 API 키와 매뉴얼을 등록해 주세요.');
      return;
    }

    addUserMessage(text);
    messageEl.value = '';
    messageEl.style.height = 'auto';

    isAnswering = true;
    sendBtn.disabled = true;
    typingRow = addTypingIndicator();

    try {
      const reply = await askGemini(text);
      removeTyping();
      addBotMessage(reply);
    } catch (err) {
      removeTyping();
      const msg = (err && err.message) ? err.message : '알 수 없는 오류';
      addBotMessage('오류가 발생했어요: ' + msg);
    } finally {
      isAnswering = false;
      sendBtn.disabled = false;
      messageEl.focus();
    }
  });

  function removeTyping() {
    if (typingRow && typingRow.parentNode) {
      typingRow.parentNode.removeChild(typingRow);
    }
    typingRow = null;
  }

  // ===== Gemini call =====
  async function askGemini(userQuestion) {
    const systemPrompt =
`너는 사용자가 등록한 [매뉴얼]을 근거로 답변하는 한국어 챗봇이다.

[매우 중요한 규칙]
1) 매뉴얼이 1인칭(나/내/제/저)으로 쓰여 있다면, 그것은 "이 매뉴얼을 등록한 사람"의 정보다. 그 주체의 정보로 인식하고 자연스럽게 3인칭이나 적절한 표현으로 답해라. (예: 매뉴얼에 "나는 매일 아침 8시에 출근한다"라고 있으면 "네, 매일 아침 8시에 출근하십니다"처럼 답한다.)
2) 매뉴얼에 직접 적힌 내용이 아니더라도, 매뉴얼로부터 합리적으로 유추 가능한 것은 적극적으로 답해라. 너무 보수적으로 거절하지 마라.
3) 매뉴얼과 정말로 아무 관련이 없는 질문일 때에만 "정보를 찾을 수 없습니다"라고 답해라.
4) 답변은 카카오톡 채팅처럼 간결하고 친근하게. 불필요한 머리말("물론입니다", "네, 알겠습니다" 같은 말)과 마크다운 기호(**, ##, - 등)는 쓰지 마라. 길어도 4~6문장 이내로.
5) 매뉴얼에 없는 정보를 지어내지 마라.

[매뉴얼]
${state.manual}`;

      const body = {
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: [
          { role: 'user', parts: [{ text: userQuestion }] }
        ],
        generationConfig: {
          temperature: 0.4,
          maxOutputTokens: 1024
        }
      };

      const url = `${API_URL}?key=${encodeURIComponent(state.apiKey)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        let errText = `HTTP ${res.status}`;
        try {
          const errJson = await res.json();
          if (errJson && errJson.error && errJson.error.message) {
            errText = errJson.error.message;
          }
        } catch (_) {}
        throw new Error(errText);
      }

      const data = await res.json();
      const text = extractText(data);
      if (!text) {
        if (data && data.promptFeedback && data.promptFeedback.blockReason) {
          throw new Error('응답이 차단되었어요 (' + data.promptFeedback.blockReason + ')');
        }
        throw new Error('빈 응답을 받았어요');
      }
      return text.trim();
  }

  function extractText(data) {
    try {
      const cands = data && data.candidates;
      if (!cands || !cands.length) return '';
      const parts = cands[0].content && cands[0].content.parts;
      if (!parts || !parts.length) return '';
      return parts.map(p => p.text || '').join('').trim();
    } catch (e) {
      return '';
    }
  }
})();
</script>
</body>
</html>
