<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>회사 매뉴얼 봇</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Pretendard", "Noto Sans KR", sans-serif;
    background: #b2c7da;
    color: #1f1f1f;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: #b2c7da;
    box-shadow: 0 0 24px rgba(0,0,0,0.08);
  }

  /* Header */
  header {
    flex: 0 0 auto;
    height: 52px;
    background: #a4b8cc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: relative;
  }
  header .title {
    font-size: 17px;
    font-weight: 700;
    color: #1f1f1f;
    letter-spacing: -0.2px;
  }

  /* Chat area */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 12px 16px;
    background: #b2c7da;
    scroll-behavior: smooth;
  }
  .day-divider {
    text-align: center;
    margin: 8px 0 14px;
  }
  .day-divider span {
    background: rgba(0,0,0,0.18);
    color: #fff;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
  }
  .msg-row {
    display: flex;
    margin-bottom: 8px;
    align-items: flex-end;
    gap: 6px;
  }
  .msg-row.bot { justify-content: flex-start; }
  .msg-row.me { justify-content: flex-end; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06);
  }
  .bubble-col {
    display: flex;
    flex-direction: column;
    max-width: 75%;
  }
  .bubble-col.me { align-items: flex-end; }
  .bubble-col.bot { align-items: flex-start; }
  .sender {
    font-size: 12px;
    color: #1f1f1f;
    margin: 0 4px 3px;
  }
  .bubble-wrap {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }
  .bubble {
    padding: 9px 12px;
    font-size: 14.5px;
    line-height: 1.45;
    border-radius: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  }
  .me .bubble {
    background: #fee500;
    color: #1f1f1f;
    border-top-right-radius: 4px;
  }
  .bot .bubble {
    background: #ffffff;
    color: #1f1f1f;
    border-top-left-radius: 4px;
  }
  .time {
    font-size: 10.5px;
    color: rgba(0,0,0,0.5);
    margin: 0 2px;
    flex-shrink: 0;
  }
  .typing .bubble {
    color: #888;
    font-style: italic;
  }
  .dots {
    display: inline-block;
  }
  .dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }

  /* Input bar */
  #inputbar {
    flex: 0 0 auto;
    background: #f6f6f6;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding: 8px 10px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #message {
    flex: 1;
    min-height: 38px;
    max-height: 120px;
    padding: 9px 12px;
    border: 1px solid #e2e2e2;
    border-radius: 18px;
    background: #fff;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    resize: none;
    line-height: 1.4;
  }
  #message:focus { border-color: #b2c7da; }
  #sendBtn {
    flex: 0 0 auto;
    background: #fee500;
    color: #1f1f1f;
    border: none;
    border-radius: 18px;
    padding: 0 16px;
    height: 38px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #sendBtn:hover { background: #ffd900; }
  #sendBtn:disabled {
    background: #e0e0e0;
    color: #999;
    cursor: not-allowed;
  }

  /* Scrollbar */
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">회사 매뉴얼 봇</div>
  </header>

  <div id="chat">
    <div class="day-divider"><span id="todayLabel"></span></div>
  </div>

  <form id="inputbar" autocomplete="off">
    <textarea id="message" rows="1" placeholder="메시지 입력"></textarea>
    <button type="submit" id="sendBtn">전송</button>
  </form>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const chatEl = $('chat');
  const messageEl = $('message');
  const sendBtn = $('sendBtn');
  const inputForm = $('inputbar');

  let isAnswering = false;
  let typingRow = null;

  const today = new Date();
  $('todayLabel').textContent = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;

  addBotMessage('안녕하세요! 회사 매뉴얼 봇이에요. 궁금한 점을 물어보세요.');

  function nowHM() {
    const d = new Date();
    const ampm = d.getHours() < 12 ? '오전' : '오후';
    let h = d.getHours() % 12;
    if (h === 0) h = 12;
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${ampm} ${h}:${m}`;
  }

  function addBotMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble-col bot">
        <div class="sender">회사 매뉴얼 봇</div>
        <div class="bubble-wrap">
          <div class="bubble"></div>
          <div class="time">${nowHM()}</div>
        </div>
      </div>`;
    row.querySelector('.bubble').textContent = text;
    chatEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row me';
    row.innerHTML = `
      <div class="bubble-col me">
        <div class="bubble-wrap">
          <div class="time">${nowHM()}</div>
          <div class="bubble"></div>
        </div>
      </div>`;
    row.querySelector('.bubble').textContent = text;
    chatEl.appendChild(row);
    scrollBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row bot typing';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble-col bot">
        <div class="bubble-wrap">
          <div class="bubble">입력 중<span class="dots"></span></div>
        </div>
      </div>`;
    chatEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function scrollBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    if (typingRow && typingRow.parentNode) {
      typingRow.parentNode.removeChild(typingRow);
    }
    typingRow = null;
  }

  messageEl.addEventListener('input', () => {
    messageEl.style.height = 'auto';
    messageEl.style.height = Math.min(messageEl.scrollHeight, 120) + 'px';
  });

  messageEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      inputForm.requestSubmit();
    }
  });

  inputForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isAnswering) return;
    const text = messageEl.value.trim();
    if (!text) return;

    addUserMessage(text);
    messageEl.value = '';
    messageEl.style.height = 'auto';

    isAnswering = true;
    sendBtn.disabled = true;
    typingRow = addTypingIndicator();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text }),
      });
      const data = await res.json().catch(() => ({}));
      removeTyping();
      if (!res.ok) {
        addBotMessage('오류가 발생했어요: ' + (data.error || `HTTP ${res.status}`));
      } else if (data.reply) {
        addBotMessage(data.reply);
      } else {
        addBotMessage('빈 응답을 받았어요.');
      }
    } catch (err) {
      removeTyping();
      addBotMessage('네트워크 오류: ' + ((err && err.message) || '알 수 없음'));
    } finally {
      isAnswering = false;
      sendBtn.disabled = false;
      messageEl.focus();
    }
  });
})();
</script>
</body>
</html>
